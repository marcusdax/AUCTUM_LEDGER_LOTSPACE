# Auctum Ledger — production compose topology
# Quickstart: docker compose -f app/docker-compose.yml --profile migrate up --build
name: auctum-ledger

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: auctum-ledger
      POSTGRES_PASSWORD: auctum-ledger
      POSTGRES_DB: auctum-ledger
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auctum-ledger"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auctum-ledger-network

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: auctum-ledger
      POSTGRES_PASSWORD: auctum-ledger
      POSTGRES_DB: auctum-ledger
    volumes:
      - tsdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auctum-ledger"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auctum-ledger-network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auctum-ledger-network

  kafka:
    image: bitnami/kafka:3.8
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_LISTENERS: PLAINTEXT://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 | head -1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - auctum-ledger-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.proxy
      target: prod
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      AI_PROXY_PORT: "3001"
      AI_ALLOWED_ORIGINS: http://localhost,http://localhost:80
      DATABASE_URL: postgresql://auctum-ledger:auctum-ledger@postgres:5432/auctum-ledger
      REDIS_URL: redis://redis:6379
      KAFKA_BROKERS: kafka:9092
      OIDC_ISSUER: https://auth.auctumledger.io
      OIDC_AUDIENCE: auctum-ledger-api
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - auctum-ledger-network

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      target: prod
      additional_contexts:
        localization: ../localization/02-locale-files
      args:
        VITE_API_BASE_URL: /api/v1
        VITE_AI_PROXY_URL: http://localhost
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - auctum-ledger-network

  # One-shot migration runner. Enable with: --profile migrate
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.proxy
      target: prod
    command: npm run db:migrate
    profiles:
      - migrate
    restart: "no"
    environment:
      DATABASE_URL: postgresql://auctum-ledger:auctum-ledger@postgres:5432/auctum-ledger
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - auctum-ledger-network

volumes:
  pgdata:
  tsdata:

networks:
  auctum-ledger-network:
    name: auctum-ledger-network
